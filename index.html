<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Text Formatter by VH</title>
    <style>
        :root {
            /* Vice City - noite */
            --bg-top: #12012e;
            --bg-bottom: #2b0a4f;
            --card: rgba(24, 6, 52, .82);
            --field: #0e0222;
            --text: #f6e9ff;
            --muted: #b79ad6;
            --pink: #ff2e97;
            --cyan: #19f0ff;
            --orange: #ff9a3c;
            --border: #5a2a8f;
            --btn-text: #12012e;
            --glow: 0 0 18px rgba(255, 46, 151, .45);
        }

        * {
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        :root {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        body {
            margin: 0;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom)) fixed;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: var(--glow);
            backdrop-filter: blur(6px);
        }

        h1 {
            margin: 0 0 20px;
            text-align: center;
            font-weight: 600;
            letter-spacing: .3px;
            font-size: clamp(24px, 5.5vw, 34px);
            line-height: 1.15;
            color: var(--text);
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 150px;
            resize: vertical;
            background: var(--field);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 12px;
            font: inherit;
            font-size: 16px;
            line-height: 1.5;
            outline: none;
        }

        textarea:focus,
        button:focus-visible,
        input:focus-visible {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(25, 240, 255, .3);
            outline: none;
        }

        textarea[readonly] {
            color: var(--cyan);
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px 24px;
            margin-bottom: 20px;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .options input {
            accent-color: var(--pink);
            width: 16px;
            height: 16px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        button {
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            padding: 11px 22px;
            border-radius: 10px;
            border: 1px solid transparent;
            transition: transform .15s, box-shadow .15s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .primary {
            background: linear-gradient(90deg, var(--pink), var(--orange));
            color: var(--btn-text);
            box-shadow: var(--glow);
        }

        .ghost {
            background: transparent;
            color: var(--cyan);
            border-color: var(--cyan);
        }

        footer {
            margin-top: 20px;
            font-size: 14px;
            color: var(--pink);
            letter-spacing: 1px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Text Formatter</h1>

        <div class="field">
            <label for="textoOriginal">Digite ou cole seu texto aqui:</label>
            <textarea id="textoOriginal" placeholder="Digite ou cole seu texto aqui..."></textarea>
        </div>

        <div class="options">
            <label><input type="checkbox" id="opcaoMinusculo" /> minúsculo</label>
            <label><input type="checkbox" id="opcaoMaiusculo" /> MAIÚSCULO </label>
            <label><input type="checkbox" id="opcaoSemAcento" /> Remover acentos | Trocar Ç por C</label>
        </div>

        <div class="buttons">
            <button id="processarBtn" class="primary">Processar texto</button>
            <button id="limparBtn" class="ghost">Limpar</button>
        </div>

        <div class="field" style="margin-top: 20px;">
            <label for="textoTratado">Texto processado:</label>
            <textarea id="textoTratado" readonly></textarea>
        </div>
    </div>

    <footer>Text Formatter by VH</footer>

    <script>
        const textoOriginal = document.getElementById('textoOriginal');
        const textoTratado = document.getElementById('textoTratado');
        const opcaoMinusculo = document.getElementById('opcaoMinusculo');
        const opcaoMaiusculo = document.getElementById('opcaoMaiusculo');
        const opcaoSemAcento = document.getElementById('opcaoSemAcento');
        const processarBtn = document.getElementById('processarBtn');
        const limparBtn = document.getElementById('limparBtn');

        function removerAcentos(texto) {
            return texto
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/ç/g, 'c')
                .replace(/Ç/g, 'C');
        }

        processarBtn.addEventListener('click', () => {
            let texto = textoOriginal.value;
            if (opcaoMinusculo.checked) texto = texto.toLowerCase();
            if (opcaoMaiusculo.checked) texto = texto.toUpperCase();
            if (opcaoSemAcento.checked) texto = removerAcentos(texto);
            textoTratado.value = texto;
        });

        limparBtn.addEventListener('click', () => {
            textoOriginal.value = '';
            textoTratado.value = '';
            opcaoMinusculo.checked = false;
            opcaoMaiusculo.checked = false;
            opcaoSemAcento.checked = false;
        });

        opcaoMinusculo.addEventListener('change', () => {
            if (opcaoMinusculo.checked) opcaoMaiusculo.checked = false;
        });

        opcaoMaiusculo.addEventListener('change', () => {
            if (opcaoMaiusculo.checked) opcaoMinusculo.checked = false;
        });
    </script>
</body>

</html>
