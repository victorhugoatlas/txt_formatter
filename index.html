<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Text Formatter by VH</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>

    <div class="container">
        <h1>Text Formatter</h1>

        <div class="field">
            <label for="textoOriginal">Digite ou cole seu texto aqui:</label>
            <textarea id="textoOriginal" placeholder="Digite ou cole seu texto aqui..."></textarea>
        </div>

        <div class="options">
            <label><input type="checkbox" id="opcaoMinusculo" /> minúsculo</label>
            <label><input type="checkbox" id="opcaoMaiusculo" /> MAIÚSCULO </label>
            <label><input type="checkbox" id="opcaoSemAcento" /> Remover acentos | Trocar Ç por C</label>
        </div>

        <div class="buttons">
            <button id="processarBtn" class="primary">Processar texto</button>
            <button id="limparBtn" class="ghost">Limpar</button>
        </div>

        <div class="field" style="margin-top: 20px;">
            <label for="textoTratado">Texto processado:</label>
            <textarea id="textoTratado" readonly></textarea>
        </div>
    </div>

    <footer>Text Formatter by VH</footer>

</body>

</html>
